services:
  homepage:
    image: docker.io/softfrost/homepage-rust:${TAG:-latest}
    build: .
    container_name: homepage
    # Rede do host: é dela que vêm o IP, o tráfego e as portas dos serviços.
    network_mode: host
    # Quem acessa os arquivos. No docker, 0 é o root da máquina, com acesso a tudo, e
    # APP_UID=1000 limita ao seu usuário. No podman rootless, 0 já é o seu usuário.
    user: "${APP_UID:-0}"
    # O SELinux não deixa um container ler os arquivos do host.
    security_opt:
      - label=disable
    environment:
      # Porta ou ip:porta. Atrás do "tailscale serve", use 127.0.0.1:5173.
      LISTEN: ${LISTEN:-5173}
      FILES_ROOT: /host
      DISK_PATH: /host
      READ_ONLY_PATHS: ${READ_ONLY_PATHS-/DATA/AppData}
      CPU_FAN_PATH: ${CPU_FAN_PATH:-}
    volumes:
      # rslave: discos montados depois também aparecem.
      - /:/host:rslave
      # Data e hora no fuso do host.
      - /etc/localtime:/etc/localtime:ro
      - ./data:/data
    restart: unless-stopped

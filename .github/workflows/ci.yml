name: CI

# PR: testes e build da imagem, sem publicar.
# Push na main ou tag v*: o mesmo e, se tudo passar, publica no Docker Hub.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: back-end
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  # Em paralelo com os testes, para a publicação só precisar do cache.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: homepage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name homepage -p 127.0.0.1:5173:5173 homepage:ci
          url=http://127.0.0.1:5173
          for _ in $(seq 20); do
            curl -sf "$url/homepage-api/auth/status" && break
            sleep 1
          done
          curl -sf "$url/homepage-api/auth/status" | grep -q '"username":null'
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/homepage-api/files/list?path=/")" = 401 ]
          curl -sf "$url/" | grep -q '<div id="root">'
          curl -sf "$url/manifest.webmanifest" | grep -q '"standalone"'
          docker stop homepage
          [ "$(docker inspect homepage --format '{{.State.ExitCode}}')" = 0 ]

  publish:
    needs: [backend, frontend, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/homepage-rust
      # Secrets não podem ir direto no `if` de um passo.
      HAS_README_TOKEN: ${{ secrets.DOCKERHUB_README_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Reaproveita o cache do job da imagem, não recompila.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Página no Docker Hub. Exige um token com Read, Write, Delete; sem ele, é pulado.
      - name: Descrição no Docker Hub
        if: github.ref == 'refs/heads/main' && env.HAS_README_TOKEN == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_README_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/homepage-rust
          short-description: Painel e gerenciador de arquivos para homelab, leve e em Rust
          readme-filepath: docs/DOCKERHUB.md
